services:
  - type: web
    name: rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: DATABASE_URL
        sync: false # Set this in Render dashboard
      - key: PYTHON_VERSION
        value: 3.10.0
