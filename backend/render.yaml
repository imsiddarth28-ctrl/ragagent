services:
  - type: web
    name: rag-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker app.main:app
    envVars:
      - key: DATABASE_URL
        value: # PASTE YOUR SUPABASE CONNECTION STRING HERE
      - key: PYTHON_VERSION
        value: 3.10.0
    disk:
      name: rag-storage
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

databases:
  - name: rag-db
    plan: free
